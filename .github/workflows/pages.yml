# Publish the interactive map (site/) to GitHub Pages.
#
# It only copies the files already committed in site/ - it does not rebuild any data.
# (site/data/ is written by scripts/build_site.py, which checks its own numbers; commit
# its output, and this workflow publishes exactly that.)
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Publish map to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:          # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
